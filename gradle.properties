# Sized for CI (GitHub's runners): the release build's R8 pass needs a real
# heap. The 3.8 GB dev box overrides these from ~/.gradle/gradle.properties
# (a user-level file wins over this one) and from the memory-capped build
# wrapper; see CLAUDE.md.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9 builds Kotlin itself by default and, separately, turns on a new DSL
# that the explicitly-applied Kotlin Android plugin cannot run under at all
# ("not compatible with AGP's 9.0 new DSL") -- both switches have to be
# flipped off together, not just the built-in-Kotlin one, or the plugin
# application itself fails before compileSdk/DSL differences even matter.
# This project still applies the Kotlin Android plugin explicitly (compose,
# serialization and KSP hang off it), so both legacy paths stay selected
# until the build scripts move to built-in Kotlin + the new DSL.
android.builtInKotlin=false
android.newDsl=false
