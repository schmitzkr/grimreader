name: Release

# Cut a signed release: workflow_dispatch with a semver version. Stamps the
# version into the build (the tag is the version of record; the file in the
# repo is a placeholder), builds the APK, tags vX.Y.Z and publishes a GitHub
# Release with the APK attached. No commit is made, so no push token is
# needed. Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version, e.g. 0.2.0 (no leading v)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version"; exit 1; }

      - name: Stamp version
        env:
          VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # Offset so version codes continue past an earlier line of builds.
          sed -i "s/versionCode = [0-9]*/versionCode = $(( RUN_NUMBER + 100 ))/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$VERSION\"/" app/build.gradle.kts
          grep -n "versionCode\|versionName" app/build.gradle.kts

      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest --no-daemon

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/release.jks"
          echo "KEYSTORE_PATH=$HOME/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk grimreader.apk
          (cd app/build/outputs/mapping/release && zip -r "$GITHUB_WORKSPACE/grimreader-mapping.zip" .) || true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          gh release create "$TAG" grimreader.apk grimreader-mapping.zip \
            --title "$TAG" --generate-notes --target "$TARGET_SHA"
