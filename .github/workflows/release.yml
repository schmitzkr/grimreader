name: Release

# Cut a signed release: workflow_dispatch with a semver version. Builds the
# APK, tags vX.Y.Z, publishes a GitHub Release with the APK attached, and
# opens a PR bumping the version in app/build.gradle.kts. Secrets:
# KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD, and optionally
# RELEASE_PUSH_TOKEN (a PAT that may open PRs), same names as the Flutter app.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version, e.g. 0.2.0 (no leading v)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Stamp version
        run: |
          set -euo pipefail
          sed -i "s/versionCode = [0-9]*/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${{ inputs.version }}\"/" app/build.gradle.kts
          grep -n "versionCode\|versionName" app/build.gradle.kts

      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest --no-daemon

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/release.jks"
          echo "KEYSTORE_PATH=$HOME/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk grimreader.apk
          (cd app/build/outputs/mapping/release && zip -r "$GITHUB_WORKSPACE/grimreader-mapping.zip" .) || true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ inputs.version }}"
          gh release create "$TAG" grimreader.apk grimreader-mapping.zip \
            --title "$TAG" --generate-notes --target "${{ github.sha }}"

      # With a personal token the bump PR gets its own CI run; with the
      # built-in token it still opens, GitHub just does not run checks on it.
      - name: Open version bump PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          BRANCH="release/v${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add app/build.gradle.kts
          git commit -m "chore: bump version to ${{ inputs.version }} (${{ github.run_number }})"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: bump version to ${{ inputs.version }}" \
            --body "Version bump from the v${{ inputs.version }} release run."
