# Sized for CI (GitHub's runners): the release build's R8 pass needs a real
# heap. The 3.8 GB dev box overrides these from ~/.gradle/gradle.properties
# (a user-level file wins over this one) and from the memory-capped build
# wrapper; see CLAUDE.md.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9 builds Kotlin itself by default; this project still applies the Kotlin
# Android plugin explicitly (compose, serialization and KSP hang off it), so the
# legacy path is selected until the build scripts move to the built-in one.
android.builtInKotlin=false
