# Kept modest on purpose: the dev box that builds this has 3.8 GB of RAM and
# has been taken down by an uncapped Gradle build once. One JVM (the Kotlin
# compiler runs in-process), no daemon left behind, two workers. Local builds
# additionally run inside a memory-capped systemd scope; see CLAUDE.md.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
