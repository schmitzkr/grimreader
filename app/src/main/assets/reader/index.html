<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  /* Transparent, not a hardcoded color: the WebView itself is transparent
     (see EpubReaderScreen.kt) over a Compose Box already painted in the
     current reading theme's color, so any moment #viewer has nothing
     painted yet (initial load, a resize's clear/relayout) shows that
     correct color through instead of flashing this page's own background. */
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent; }
  #viewer { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
</style>
<script>
  // Last-resort net: anything that slips past reader.js's own try/catch
  // (a script failing to parse, an error inside an event listener) would
  // otherwise leave a permanently blank page with no trace anywhere.
  window.onerror = function (message, source, lineno) {
    if (window.Android && window.Android.onError) {
      window.Android.onError('window.onerror: ' + message + ' @ ' + source + ':' + lineno);
    }
    return false;
  };
</script>
<script src="jszip.min.js"></script>
<script src="epub.min.js"></script>
<script src="reader.js"></script>
</head>
<body><div id="viewer"></div></body>
</html>
